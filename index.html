<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة تحويل النصوص لأصوات</title>
    <style>
        body { background: #eef2f7; font-family: Tahoma, Arial, sans-serif; text-align: right; direction: rtl; margin: 0; padding: 20px; }
        .box { width: 500px; max-width: 100%; margin: 20px auto; background: #fff; padding: 25px; border: 2px solid #333; border-radius: 8px; box-sizing: border-box; }
        .ad { background: #ffeb3b; padding: 15px; margin-bottom: 15px; text-align: center; border: 2px dashed #f57c00; color: #d32f2f; font-size: 15px; font-weight: bold; border-radius: 4px; display: block; }
        textarea { width: 100%; height: 130px; margin-bottom: 15px; padding: 10px; box-sizing: border-box; font-size: 16px; border: 2px solid #ccc; border-radius: 4px; display: block; resize: vertical; }
        .btn { width: 100%; padding: 15px; color: #fff; border: none; font-size: 18px; font-weight: bold; margin-bottom: 10px; cursor: pointer; border-radius: 4px; display: block; text-align: center; }
        .btn-green { background: #2e7d32; }
        .btn-blue { background: #1976d2; }
        audio { width: 100%; margin-top: 15px; display: block; border: 1px solid #ccc; border-radius: 4px; }
        #status { margin-top: 10px; padding: 10px; background: #e8f5e9; color: #2e7d32; font-weight: bold; text-align: center; border-radius: 4px; display: block; }
    </style>
</head>
<body>
    <div class="box">
        <!-- مساحة إعلانية علوية -->
        <div class="ad">📢 مساحة إعلانية علوية (Banner Ad)</div>
        
        <h2 style="color: #2e7d32; text-align: center; margin-top: 0;">منصة تحويل النصوص لأصوات</h2>
        <p style="text-align: center; color: #555; font-size: 14px;">اكتب النص، استمع إليه، وحمله كملف MP3</p>

        <textarea id="txt" placeholder="اكتب هنا أي نص باللغة العربية..."></textarea>

        <button class="btn btn-green" onclick="playAudioDirect()">🔊 استماع مباشر للصوت</button>
        <button class="btn btn-blue" onclick="downloadMP3File()">📥 تحميل ملف MP3</button>

        <!-- مشغل صوت مرئي آمن -->
        <audio id="audioPlayer" controls="controls"></audio>

        <div id="status">جاهز للاستخدام</div>

        <!-- مساحة إعلانية سفلية -->
        <div class="ad" style="margin-top: 15px;">📢 مساحة إعلانية سفلية (Banner Ad)</div>
    </div>

    <script>
        function updateStatus(msg) {
            var st = document.getElementById('status');
            st.innerHTML = msg;
        }

        function getTTSUrl() {
            var t = document.getElementById('txt').value;
            if (!t || t.replace(/^\s+|\s+$/g, '') === '') {
                alert('الرجاء كتابة نص في المربع أولاً!');
                return null;
            }
            var encoded = encodeURIComponent(t);
            // استخدام رابط بديل ومضمون لتوليد الصوت بدون أخطاء 404
            return 'https://api.voicemaker.in/tts?text=' + encoded + '&voice=ar-SA-ZariyahNeural';
        }

        function playAudioDirect() {
            var url = getTTSUrl();
            if (!url) return;
            
            updateStatus('جاري تحميل وتشغيل الصوت...');
            var player = document.getElementById('audioPlayer');
            player.src = url;
            player.play().then(function() {
                updateStatus('يعمل الصوت الآن من المشغل أدناه.');
            }).catch(function(err) {
                updateStatus('اضغط على زر التشغيل ▶ في مشغل الصوت أدناه يدوياً.');
            });
        }

        function downloadMP3File() {
            var url = getTTSUrl();
            if (!url) return;
            
            updateStatus('جاري تجهيز تحميل ملف الـ MP3...');
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
