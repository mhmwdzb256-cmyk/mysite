<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة تحويل النصوص لأصوات</title>
    <style>
        body { background: #f0f2f5; font-family: Tahoma, Arial, sans-serif; text-align: right; direction: rtl; margin: 0; padding: 20px; }
        .box { width: 500px; max-width: 100%; margin: 20px auto; background: #fff; padding: 25px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .ad { background: #fff3cd; padding: 12px; margin-bottom: 15px; text-align: center; border: 1px dashed #ffeeba; color: #856404; font-size: 13px; border-radius: 4px; }
        textarea { width: 100%; height: 130px; margin-bottom: 15px; padding: 10px; box-sizing: border-box; font-size: 16px; display: block; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        .btn1 { width: 100%; padding: 14px; background: #2e7d32; color: #fff; border: none; font-size: 16px; font-weight: bold; margin-bottom: 10px; cursor: pointer; display: block; border-radius: 4px; }
        .note { font-size: 12px; color: #666; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <!-- مساحة إعلانية علوية -->
        <div class="ad">مساحة إعلانية علوية (Banner Ad)</div>
        
        <h2 style="color: #2e7d32; text-align: center; margin-top: 0;">منصة تحويل النصوص لأصوات</h2>
        <p style="text-align: center; color: #666; font-size: 14px;">اكتب النص واستمّع إليه مباشرة من جهازك</p>

        <textarea id="txt" placeholder="اكتب النص هنا بالعربية..."></textarea>

        <button class="btn1" onclick="speakText()">استماع مباشر</button>

        <div class="note">يعتمد على محرك الصوت المداخلي لضمان عدم توقفه أبداً.</div>

        <!-- مساحة إعلانية سفلية -->
        <div class="ad" style="margin-top: 15px;">مساحة إعلانية سفلية (Banner Ad)</div>
    </div>

    <script>
        function speakText() {
            var text = document.getElementById('txt').value;
            if(!text || text.trim() === '') {
                alert('الرجاء كتابة نص أولاً!');
                return;
            }
            if (!('speechSynthesis' in window)) {
                alert('متصفحك لا يدعم خاصية التحدث الصوتي، يفضل استخدام متصفح حديث.');
                return;
            }
            window.speechSynthesis.cancel(); // إيقاف أي صوت سابق
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA'; // لغة عربية
            utterance.rate = 1.0; // السرعة عادية
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
