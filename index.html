<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة تحويل النصوص لأصوات</title>
    <style>
        body { background: #f0f2f5; font-family: Tahoma, Arial, sans-serif; text-align: right; direction: rtl; margin: 0; padding: 20px; }
        .box { width: 500px; max-width: 100%; margin: 20px auto; background: #fff; padding: 25px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .ad { background: #fff3cd; padding: 12px; margin-bottom: 15px; text-align: center; border: 1px dashed #ffeeba; color: #856404; font-size: 13px; border-radius: 4px; display: block; }
        textarea { width: 100%; height: 130px; margin-bottom: 15px; padding: 10px; box-sizing: border-box; font-size: 16px; display: block; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        .btn-play { width: 100%; padding: 14px; background: #2e7d32; color: #fff; border: none; font-size: 16px; font-weight: bold; margin-bottom: 10px; cursor: pointer; display: block; border-radius: 4px; }
        .btn-download { width: 100%; padding: 14px; background: #1976d2; color: #fff; border: none; font-size: 16px; font-weight: bold; margin-bottom: 10px; cursor: pointer; display: block; border-radius: 4px; }
        audio { width: 100%; margin-top: 10px; display: block; }
    </style>
</head>
<body>
    <div class="box">
        <!-- مساحة إعلانية علوية -->
        <div class="ad">مساحة إعلانية علوية (Banner Ad)</div>
        
        <h2 style="color: #2e7d32; text-align: center; margin-top: 0;">منصة تحويل النصوص لأصوات</h2>
        <p style="text-align: center; color: #666; font-size: 14px;">اكتب النص، استمع إليه، وحمله كملف MP3</p>

        <textarea id="txt" placeholder="اكتب النص هنا بالعربية..."></textarea>

        <button class="btn-play" onclick="playAudio()">استماع مباشر</button>
        <button class="btn-download" onclick="downloadAudio()">تحميل كـ MP3</button>

        <audio id="player" controls="controls"></audio>

        <!-- مساحة إعلانية سفلية -->
        <div class="ad" style="margin-top: 15px;">مساحة إعلانية سفلية (Banner Ad)</div>
    </div>

    <script>
        function getAudioUrl() {
            var t = document.getElementById('txt').value;
            if(!t || t.replace(/^\s+|\s+$/g, '') === '') {
                alert('الرجاء كتابة نص أولاً!');
                return null;
            }
            var encoded = encodeURIComponent(t);
            return 'https://translate.google.com/translate_tts?ie=UTF-8&q=' + encoded + '&tl=ar&client=tw-ob';
        }

        function playAudio() {
            var url = getAudioUrl();
            if(!url) return;
            var p = document.getElementById('player');
            p.src = url;
            p.play();
        }

        function downloadAudio() {
            var url = getAudioUrl();
            if(!url) return;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
