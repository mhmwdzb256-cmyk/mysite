<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو الصوت الاحترافي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f4; padding: 20px; text-align: right; margin: 0; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 10px; }
        p { color: #666; text-align: center; margin-bottom: 20px; font-size: 14px; }
        textarea { width: 100%; height: 130px; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }
        select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; background: white; }
        button { width: 100%; padding: 14px; background: #2E7D32; color: white; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1B5E20; }
    </style>
</head>
<body>
    <div class="container">
        <h2>استوديو الصوت الاحترافي</h2>
        <p>اكتب النص واستمع إليه فوراً!</p>
        
        <textarea id="textInput" placeholder="اكتب النص هنا..."></textarea>
        
        <label for="rateSelect">سرعة النطق:</label>
        <select id="rateSelect">
            <option value="0.75">بطيء</option>
            <option value="1" selected>عادي (طبيعي)</option>
            <option value="1.25">سريع</option>
        </select>

        <button onclick="speakText()">استماع ونطق الصوت</button>
    </div>

    <script>
        function speakText() {
            const text = document.getElementById('textInput').value.trim();
            const rate = parseFloat(document.getElementById('rateSelect').value);
            
            if (!text) {
                alert('الرجاء كتابة نص أولاً!');
                return;
            }

            if (!('speechSynthesis' in window)) {
                alert('متصفحك لا يدعم النطق.');
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = rate;

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
